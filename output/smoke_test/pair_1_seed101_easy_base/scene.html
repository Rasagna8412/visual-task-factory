<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Technical Diagram - Seed 101 (easy)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 1024px;
      height: 1024px;
      overflow: hidden;
      background-color: #0b1120;
    }
    svg {
      display: block;
      width: 1024px;
      height: 1024px;
      user-select: none;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
    }
    .major-grid-line {
      stroke: #334155;
      stroke-width: 1.5;
      stroke-dasharray: 4,4;
    }
    .distractor-trace {
      stroke: #38bdf8;
      stroke-opacity: 0.35;
      stroke-width: 1.2;
      stroke-dasharray: 5,4;
      fill: none;
    }
    .crosshair {
      stroke: #64748b;
      stroke-width: 1.2;
    }
    .tech-label {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      fill: #475569;
      letter-spacing: 0.5px;
    }
    .node-shape {
      stroke: #020617;
      stroke-width: 2.2;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
